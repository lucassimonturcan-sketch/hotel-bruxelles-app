<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hôtel Bruxelles</title>
<meta name="theme-color" content="#1C1B19">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hôtel Bruxelles">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
@font-face{font-family:'Theano Didot';src:url(fonts/TheanoDidot-Regular.woff2) format('woff2');font-display:swap}
/* Style inspiré de l'application Claude : sobre, sombre, sans emoji */
:root{--bg:#1C1B19;--panel:#262523;--bubble:#33322F;--text:#ECEBE6;--muted:#9C9B95;--line:#3A3936;--accent:#D97757;--gold:#D4B978;--accent-ink:#FFFFFF;--ok:#5FA36E;--no:#E0786E;--shadow:0 10px 40px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button,textarea,input{font:inherit;color:inherit}
svg{display:block}
header{padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;justify-content:center;position:relative;background:var(--bg);border-bottom:1px solid var(--line)}
header h1{font:400 17px/1.2 'Theano Didot',Georgia,serif;letter-spacing:.02em;text-align:center}
header h1 small{display:block;font:12px -apple-system,system-ui,sans-serif;color:var(--muted);margin-top:2px}
.ico{position:absolute;right:10px;bottom:8px;background:none;border:0;color:var(--muted);width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 20px}
.msgs{min-width:0;display:flex;flex-direction:column;gap:18px}
.m{min-width:0;overflow:hidden;word-wrap:break-word}
.m--me{align-self:flex-end;max-width:85%;background:var(--bubble);padding:10px 14px;border-radius:18px}
.m--ai{align-self:stretch}
.m--sys{align-self:center;color:var(--muted);font-size:13px;text-align:center}
.m p+p,.m p+ul,.m ul+p{margin-top:10px}.m ul{padding-left:20px}.m li+li{margin-top:4px}
.m a{color:var(--accent)}.m code{font:13px ui-monospace,Menlo,monospace;background:var(--bubble);padding:1px 5px;border-radius:5px}
.m--ai .cap{font-size:13px;color:var(--muted);margin-bottom:8px}
.day{align-self:center;font-size:12px;color:var(--muted);margin-top:10px}
.shots{max-width:100%;display:flex;gap:8px;overflow-x:auto;margin-top:8px}
.shots img{height:240px;border-radius:12px;border:1px solid var(--line);background:var(--bubble);cursor:zoom-in}
.m--me .shots img{height:140px;border:0}
.file{display:inline-flex;align-items:center;gap:6px;font-size:14px;margin-top:6px;color:var(--muted)}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 16px;font-size:15px;font-weight:500;cursor:pointer}
.btn--ok{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn--no{color:var(--no)}
.btn:disabled{opacity:.5}
.typing{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.typing .spark{width:18px;height:18px;color:var(--accent);animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.notif{align-self:center;background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
/* zone d'écriture */
.compose{padding:10px 12px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(to top,var(--bg) 70%,transparent)}
.box{position:relative;max-width:720px;margin:0 auto;background:rgba(38,37,35,.78);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:24px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.05);padding:12px 10px 8px 16px;transition:box-shadow .3s}
.box::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(120deg,rgba(217,119,87,.75),rgba(212,185,120,.35) 40%,rgba(255,255,255,.06) 70%,rgba(217,119,87,.5));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.box:focus-within{box-shadow:var(--shadow),0 0 0 4px rgba(217,119,87,.12),0 0 32px rgba(217,119,87,.18)}
.box .label{position:absolute;top:-9px;left:18px;font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);background:var(--bg);padding:2px 8px;border-radius:6px}
textarea{width:100%;resize:none;border:0;background:transparent;outline:none;min-height:24px;max-height:160px;font-size:16px;line-height:1.45;padding:2px 0 6px}
textarea::placeholder{color:var(--muted)}
.bar{display:flex;align-items:center;gap:4px}
.bar .sp{flex:1}
.tool{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02);margin-right:4px;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.tool.rec{color:var(--no)}
.send{width:36px;height:36px;border-radius:12px;border:0;background:linear-gradient(135deg,#E08A6A,var(--accent));box-shadow:0 4px 14px rgba(217,119,87,.35);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.send:disabled{opacity:.4}
.thumbs{display:flex;gap:8px;margin-bottom:8px;overflow-x:auto}.thumbs:empty{display:none}
.thumbs div{position:relative;flex:none}.thumbs img{height:56px;width:56px;object-fit:cover;border-radius:10px}
.thumbs .doc{height:56px;width:90px;border-radius:10px;background:var(--bubble);display:flex;align-items:center;justify-content:center;font-size:11px;text-align:center;padding:4px;overflow:hidden;word-break:break-all;color:var(--muted)}
.thumbs button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--text);color:var(--bg);font-size:12px;line-height:1}
/* connexion */
.login{max-width:420px;margin:0 auto;padding:56px 20px;text-align:center}
.login .logo{font:400 48px/1 'Theano Didot',Georgia,serif;color:#B89B5E;border-bottom:2px solid #B89B5E;display:inline-block;padding:0 6px 6px;margin-bottom:24px}
.login h2{font:400 24px 'Theano Didot',Georgia,serif;margin-bottom:8px}
.login p{color:var(--muted);margin-bottom:22px;font-size:15px}
.login input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:12px;background:var(--panel);font-size:16px}
.login .btn{width:100%;padding:13px;background:var(--text);color:var(--bg);border-color:var(--text)}
.err{color:var(--no);font-size:14px;margin:8px 0}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top) + 50px) 10px 20px}
.zoom img{max-width:100%;border-radius:8px}
.zoom button{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:12px;font-size:28px;color:#fff;background:none;border:0}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <h1 id="title">Hôtel Bruxelles<small>Assistant du site</small></h1>
  <button class="ico hidden" id="site" aria-label="Voir le site"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
</header>
<main id="main"></main>
<div class="compose hidden" id="compose"><div class="box">
  <span class="label">Agent · Hôtel Bruxelles</span>
  <div class="thumbs" id="thumbs"></div>
  <textarea id="txt" rows="1" placeholder="Écrire à l’agent…"></textarea>
  <div class="bar">
    <button class="tool" id="pic" aria-label="Joindre des photos ou des fichiers"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg></button>
    <input type="file" id="file" multiple hidden>
    <span class="sp"></span>
    <button class="tool" id="mic" aria-label="Dicter"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg></button>
    <button class="send" id="send" aria-label="Envoyer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg></button>
  </div>
</div></div>
<script>
// affiche l'erreur à l'écran si l'application ne démarre pas (pour pouvoir la signaler)
window.onerror = function (m, s, l) { var d = document.getElementById('main'); if (d && !d.children.length) d.innerHTML = '<div class="empty">Erreur de démarrage : ' + m + ' (ligne ' + l + ')<br><br>Fermez et rouvrez l’application.</div>'; };
setTimeout(function () { var d = document.getElementById('main'); if (d && !d.children.length) d.innerHTML = '<div class="empty">Chargement impossible. Vérifiez la connexion internet, puis fermez et rouvrez l’application.</div>'; }, 8000);
</script>
<script src="app.js?v=12"></script>
</body>
</html>
