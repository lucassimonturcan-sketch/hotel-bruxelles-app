<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hôtel Bruxelles</title>
<meta name="theme-color" content="#1A1714">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hôtel Bruxelles">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
@font-face{font-family:'Theano Didot';src:url(fonts/TheanoDidot-Regular.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Free Sans';src:url(fonts/FreeSans.woff2) format('woff2');font-weight:100 500;font-display:swap}
@font-face{font-family:'Free Sans';src:url(fonts/FreeSans-Bold.woff2) format('woff2');font-weight:600 900;font-display:swap}
:root{--dark:#1A1714;--dark2:#2A2520;--mid:#8A8078;--light:#E8E0D4;--cream:#F5F0E8;--white:#FAF8F5;--gold:#B89B5E;--gold2:#D4B978;--text:#3A3530;--ok:#3F7A4E;--no:#9A3B32}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--cream);color:var(--text);font:17px/1.45 'Free Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button,textarea,input{font:inherit;color:inherit}
header{background:var(--dark);color:var(--cream);padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header h1{font:400 22px/1.1 'Theano Didot',serif;letter-spacing:.02em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 small{display:block;font:12px 'Free Sans';color:var(--gold2);letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.ico{background:none;border:0;color:var(--gold2);font-size:26px;width:40px;height:40px;border-radius:50%;cursor:pointer}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-weight:600;font-size:18px;cursor:pointer;text-align:center}
.btn--gold{background:var(--gold);color:var(--dark)}
.btn--dark{background:var(--dark);color:var(--cream)}
.btn--line{background:transparent;border:1.5px solid var(--mid);color:var(--text)}
.btn:disabled{opacity:.5}
.card{background:var(--white);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 0 rgba(0,0,0,.05)}
.list .card{display:block;width:100%;text-align:left;border:0;cursor:pointer}
.list h3{font-weight:600;font-size:17px;margin-bottom:4px}
.meta{font-size:13px;color:var(--mid)}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:20px;padding:2px 9px;margin-right:6px;background:var(--light);color:var(--text)}
.tag--work{background:var(--gold2);color:var(--dark)}.tag--ok{background:#DCEBDF;color:var(--ok)}.tag--wait{background:var(--dark);color:var(--gold2)}
.empty{text-align:center;color:var(--mid);padding:40px 10px}
.sec{font:600 12px 'Free Sans';letter-spacing:.12em;text-transform:uppercase;color:var(--mid);margin:18px 2px 8px}
/* conversation */
.msgs{display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.m{max-width:88%;padding:12px 14px;border-radius:18px;word-wrap:break-word}
.m--me{align-self:flex-end;background:var(--dark);color:var(--cream);border-bottom-right-radius:6px}
.m--ai{align-self:flex-start;background:var(--white);border-bottom-left-radius:6px}
.m--sys{align-self:center;background:transparent;color:var(--mid);font-size:14px;text-align:center}
.m .who{font-size:12px;font-weight:600;color:var(--gold);margin-bottom:4px;letter-spacing:.04em}
.m p+p,.m ul{margin-top:6px}.m ul{padding-left:20px}.m a{color:var(--gold)}
.m code{font-size:.9em;background:rgba(0,0,0,.06);padding:0 4px;border-radius:4px}
.shots{display:flex;gap:8px;overflow-x:auto;margin-top:10px}
.shots img{height:260px;border-radius:10px;border:1px solid var(--light);background:var(--light);cursor:zoom-in}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.acts .btn{font-size:15px;padding:13px 6px}
.btn--ok{background:var(--ok);color:#fff}.btn--no{background:transparent;border:1.5px solid var(--no);color:var(--no)}
.typing{align-self:flex-start;background:var(--white);border-radius:18px;padding:12px 16px;color:var(--mid);font-size:15px}
.typing i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:4px;animation:b 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s;margin-right:10px}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
/* barre d'écriture */
.compose{background:var(--white);border-top:1px solid var(--light);padding:10px 12px calc(env(safe-area-inset-bottom) + 10px)}
.compose .in{max-width:720px;margin:0 auto}
.mode{display:flex;gap:6px;margin-bottom:8px}
.mode button{flex:1;border:1.5px solid var(--light);background:transparent;border-radius:20px;padding:7px;font-size:14px;cursor:pointer}
.mode button.on{background:var(--dark);color:var(--gold2);border-color:var(--dark)}
.row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;border:1.5px solid var(--light);border-radius:20px;padding:11px 14px;min-height:46px;max-height:160px;background:var(--cream);outline:none}
textarea:focus{border-color:var(--gold)}
.send{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--gold);color:var(--dark);font-size:20px;cursor:pointer}
.mic{flex:none;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--light);background:transparent;font-size:20px;cursor:pointer}
.mic.rec{background:var(--no);border-color:var(--no);color:#fff}
.hint{font-size:12px;color:var(--mid);margin-top:6px;text-align:center}
/* connexion */
.login{max-width:440px;margin:0 auto;padding:40px 20px;text-align:center}
.login .logo{font:400 64px/1 'Theano Didot',serif;color:var(--gold);border-bottom:2px solid var(--gold);display:inline-block;padding:0 6px 6px;margin-bottom:22px}
.login h2{font:400 26px 'Theano Didot',serif;margin-bottom:8px}
.login p{color:var(--mid);margin-bottom:22px}
.login input{width:100%;border:1.5px solid var(--light);border-radius:14px;padding:15px;margin-bottom:12px;background:var(--white);font-size:16px}
.err{color:var(--no);font-size:14px;margin:8px 0}
.zoom{position:fixed;inset:0;background:rgba(10,10,10,.92);z-index:20;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top) + 50px) 10px 20px}
.zoom img{max-width:100%;border-radius:8px}
.zoom button{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:12px;font-size:30px;color:#fff;background:none;border:0}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <button class="ico hidden" id="back" aria-label="Retour">‹</button>
  <h1 id="title">Hôtel Bruxelles<small>Assistant du site</small></h1>
  <button class="ico hidden" id="site" aria-label="Voir le site">⌂</button>
</header>
<main id="main"></main>
<div class="compose hidden" id="compose"><div class="in">
  <div class="mode" id="mode">
    <button data-m="do" class="on">✏️ Modifier le site</button>
    <button data-m="idea">💡 Réfléchir à une idée</button>
  </div>
  <div class="row">
    <button class="mic" id="mic" aria-label="Dicter">🎤</button>
    <textarea id="txt" rows="1" placeholder="Écrivez votre demande…"></textarea>
    <button class="send" id="send" aria-label="Envoyer">➤</button>
  </div>
  <div class="hint" id="hint">Vous pouvez aussi dicter avec le micro du clavier.</div>
</div></div>
<script src="app.js"></script>
</body>
</html>
